<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Облачный чат</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #4f8cff;
    --text: #e7e9ee;
    --muted: #8a8f9c;
    --bubble-mine: #2b5fd9;
    --bubble-other: #23262f;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--panel);
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid #2a2e38;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #signOutBtn {
    background: none;
    border: 1px solid #3a3f4b;
    color: var(--muted);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 400;
  }

  /* ---------- Экран входа/регистрации ---------- */
  #auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    gap: 12px;
  }
  #auth-screen h2 { margin: 0 0 4px; font-size: 20px; }
  #auth-screen p.hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  #auth-screen input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e38;
    background: #1c1f28;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #auth-screen input:focus { border-color: var(--accent); }
  #auth-screen button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #auth-screen button:disabled { opacity: 0.5; cursor: not-allowed; }
  #toggleModeBtn {
    background: none !important;
    color: var(--accent) !important;
    font-weight: 400 !important;
    font-size: 13px !important;
    padding: 4px !important;
  }
  #auth-error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
  }

  /* ---------- Экран чата ---------- */
  #chat-screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .message {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--bubble-other);
    align-self: flex-start;
    font-size: 14px;
    line-height: 1.4;
  }
  .message.mine {
    background: var(--bubble-mine);
    align-self: flex-end;
  }
  .message .name {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .message.mine .name { color: #cfe0ff; }
  #typing {
    min-height: 18px;
    padding: 0 16px;
    font-size: 12px;
    color: var(--muted);
  }
  #chat-screen form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #2a2e38;
  }
  #chat-screen input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: none;
    background: #23262f;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #chat-screen form button {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #chat-screen form button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Облачный чат</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="status">вход…</span>
      <button id="signOutBtn" style="display:none;">Выйти</button>
    </div>
  </header>

  <!-- Экран входа / регистрации -->
  <div id="auth-screen">
    <h2 id="authTitle">Вход</h2>
    <p class="hint" id="authHint">Войдите по email и паролю, чтобы попасть в чат.</p>
    <input id="emailInput" type="email" placeholder="Email" autocomplete="email" />
    <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password" />
    <div id="auth-error"></div>
    <button id="authSubmitBtn">Войти</button>
    <button id="toggleModeBtn" type="button">Нет аккаунта? Зарегистрироваться</button>
  </div>

  <!-- Экран чата -->
  <div id="chat-screen">
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="form">
      <input id="input" placeholder="Напишите сообщение…" autocomplete="off" disabled />
      <button type="submit" disabled>Отправить</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile,
    signOut,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ---------- НАСТРОЙКИ: замените на свои ----------
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };
  // Бэкенд и фронтенд теперь на одном сервисе — используем текущий адрес.
  const BACKEND_URL = window.location.origin;
  // ---------------------------------------------------

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ---- элементы: шапка / статус ----
  const statusEl = document.getElementById('status');
  const signOutBtn = document.getElementById('signOutBtn');

  // ---- элементы: экран входа ----
  const authScreen = document.getElementById('auth-screen');
  const authTitle = document.getElementById('authTitle');
  const authHint = document.getElementById('authHint');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const authError = document.getElementById('auth-error');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const toggleModeBtn = document.getElementById('toggleModeBtn');

  // ---- элементы: экран чата ----
  const chatScreen = document.getElementById('chat-screen');
  const messagesEl = document.getElementById('messages');
  const typingEl = document.getElementById('typing');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = form.querySelector('button');

  let isRegisterMode = false;
  let socket = null;
  let myUid = null;

  function setAuthMode(register) {
    isRegisterMode = register;
    authTitle.textContent = register ? 'Регистрация' : 'Вход';
    authHint.textContent = register
      ? 'Придумайте email и пароль (минимум 6 символов).'
      : 'Войдите по email и паролю, чтобы попасть в чат.';
    authSubmitBtn.textContent = register ? 'Зарегистрироваться' : 'Войти';
    toggleModeBtn.textContent = register ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    authError.textContent = '';
  }

  function friendlyAuthError(err) {
    const map = {
      'auth/invalid-email': 'Некорректный email.',
      'auth/missing-password': 'Введите пароль.',
      'auth/weak-password': 'Пароль слишком короткий (минимум 6 символов).',
      'auth/email-already-in-use': 'Этот email уже зарегистрирован. Попробуйте войти.',
      'auth/invalid-credential': 'Неверный email или пароль.',
      'auth/user-not-found': 'Пользователь не найден. Зарегистрируйтесь.',
      'auth/wrong-password': 'Неверный пароль.',
      'auth/too-many-requests': 'Слишком много попыток. Подождите немного.',
    };
    return map[err.code] || 'Ошибка входа: ' + err.message;
  }

  toggleModeBtn.addEventListener('click', () => setAuthMode(!isRegisterMode));

  authSubmitBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    authError.textContent = '';
    authSubmitBtn.disabled = true;

    try {
      if (isRegisterMode) {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        // Имя пользователя в чате = часть email до "@"
        await updateProfile(cred.user, { displayName: email.split('@')[0] });
        await cred.user.getIdToken(true); // обновляем токен, чтобы подхватилось имя
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      // дальше onAuthStateChanged сам покажет чат
    } catch (err) {
      authError.textContent = friendlyAuthError(err);
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  signOutBtn.addEventListener('click', async () => {
    if (socket) socket.disconnect();
    await signOut(auth);
  });

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function addMessage(msg) {
    const div = document.createElement('div');
    div.className = 'message' + (msg.uid === myUid ? ' mine' : '');
    div.innerHTML = `<span class="name">${escapeHtml(msg.name || 'Без имени')}</span>${escapeHtml(msg.text)}`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function loadSocketIoClient() {
    return new Promise((resolve, reject) => {
      if (window.io) return resolve(window.io);
      const script = document.createElement('script');
      script.src = `${BACKEND_URL}/socket.io/socket.io.js`;
      script.onload = () => resolve(window.io);
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // Не вошли — показываем форму входа, прячем чат
      authScreen.style.display = 'flex';
      chatScreen.style.display = 'none';
      signOutBtn.style.display = 'none';
      statusEl.textContent = 'не в сети';
      messagesEl.innerHTML = '';
      return;
    }

    // Вошли — прячем форму, показываем чат
    authScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    signOutBtn.style.display = 'inline-block';
    statusEl.textContent = 'подключение…';

    myUid = user.uid;
    const token = await user.getIdToken();

    try {
      const res = await fetch(`${BACKEND_URL}/messages`);
      const history = await res.json();
      history.forEach(addMessage);
    } catch (e) {
      console.error('Не удалось загрузить историю:', e);
    }

    const io = await loadSocketIoClient();
    socket = io(BACKEND_URL, { auth: { token } });

    socket.on('connect', () => {
      statusEl.textContent = 'в сети';
      input.disabled = false;
      sendBtn.disabled = false;
    });
    socket.on('disconnect', () => {
      statusEl.textContent = 'отключено';
      input.disabled = true;
      sendBtn.disabled = true;
    });
    socket.on('connect_error', (err) => {
      statusEl.textContent = 'ошибка подключения';
      console.error(err);
    });
    socket.on('message', addMessage);
    socket.on('typing', ({ name }) => {
      typingEl.textContent = `${name} печатает…`;
      clearTimeout(typingEl._t);
      typingEl._t = setTimeout(() => (typingEl.textContent = ''), 2000);
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !socket) return;
    socket.emit('message', { text });
    input.value = '';
  });

  let typingTimeout;
  input.addEventListener('input', () => {
    if (!socket) return;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => socket.emit('typing'), 150);
  });
</script>
</body>
</html>
